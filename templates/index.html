<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14634c">
  <title>ClearCut | Spoiler-Safe Review Verdicts</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="{{ url_for('static', filename='app.js', v='paste-only-3') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/mark.svg" width="34" height="34" alt="">ClearCut<span>REVIEW LAB</span></a>
    <span class="local-status"><span></span>Local session</span>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">MOVIES &amp; TELEVISION</p><h1>Opinions. Without the plot.</h1></div><span class="edition">CLEARCUT / REVIEWS</span></div>
    <div class="workspace paste-only">
      <section class="input-panel" aria-labelledby="input-heading">
        <div class="section-title"><h2 id="input-heading">Your original review</h2></div>
        <form id="review-form">
          <label for="reviews">Paste review</label>
          <textarea id="reviews" rows="16" maxlength="120000" placeholder="Paste a movie or series review here..." required></textarea>
          <button type="submit" id="analyze" class="primary">Generate spoiler-free review <span aria-hidden="true">&rarr;</span></button>
          <p id="error" class="error-message" role="alert" hidden></p>
        </form>
      </section>
      <section class="report-panel" aria-labelledby="report-heading" aria-live="polite" aria-busy="false">
        <div class="section-title"><div><p class="eyebrow">SPOILER-FREE REVIEW</p><h2 id="report-heading">Your review</h2></div></div>
        <p id="report-state" class="muted" role="status"></p>
        <section id="written-review" aria-labelledby="review-heading" hidden>
          <div class="review-heading-row"><h3 id="review-heading">The review</h3></div>
          <div id="review-text"></div>
        </section>
      </section>
    </div>
    <footer>ClearCut <span>Movies &amp; television</span></footer>
  </main>
</body>
</html>
